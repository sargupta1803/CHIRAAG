services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: chiraag
      POSTGRES_PASSWORD: chiraag
      POSTGRES_DB: chiraag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://chiraag:chiraag@db:5432/chiraag
    depends_on:
      - db
    volumes:
      - .:/code

volumes:
  pgdata: